name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.3.14
  PRISMA_PLACEHOLDER_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder

jobs:
  check:
    name: Lint, types and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate
        working-directory: packages/database
        env:
          DATABASE_URL: ${{ env.PRISMA_PLACEHOLDER_URL }}

      - name: Lint and format
        run: bunx biome ci .

      - name: Typecheck
        run: bun run typecheck

      - name: Build the CLI
        run: bun run build:cli

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate
        working-directory: packages/database
        env:
          DATABASE_URL: ${{ env.PRISMA_PLACEHOLDER_URL }}

      - name: Test
        run: bun test
        env:
          DATABASE_URL: ${{ env.PRISMA_PLACEHOLDER_URL }}

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate
        working-directory: packages/database
        env:
          DATABASE_URL: ${{ env.PRISMA_PLACEHOLDER_URL }}

      - name: Test with coverage
        run: bun test --coverage --coverage-reporter=text --coverage-reporter=lcov
        env:
          DATABASE_URL: ${{ env.PRISMA_PLACEHOLDER_URL }}

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: error
